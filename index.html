<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TaraTari · tools</title>

    <!-- Google Fonts + Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Flex:opsz,wght@8..144,400..700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Rounded" rel="stylesheet" />

    <style>
        /* ============================================================
           Dark · Green/Mint colour scheme (M3‑inspired)
           ============================================================ */
        :root {
            --md-sys-color-primary: #4CAF50;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-primary-container: #1E3A2A;
            --md-sys-color-on-primary-container: #A5D6A7;

            --md-sys-color-secondary: #26A69A;
            --md-sys-color-on-secondary: #FFFFFF;
            --md-sys-color-secondary-container: #1A2E2A;
            --md-sys-color-on-secondary-container: #80CBC4;

            --md-sys-color-tertiary: #7CB342;
            --md-sys-color-on-tertiary: #FFFFFF;
            --md-sys-color-tertiary-container: #1F3A1A;
            --md-sys-color-on-tertiary-container: #AED581;

            --md-sys-color-surface: #121212;
            --md-sys-color-on-surface: #E8E8E8;
            --md-sys-color-surface-variant: #1E1E1E;
            --md-sys-color-on-surface-variant: #A0A0A0;

            --md-sys-color-surface-container-lowest: #0A0A0A;
            --md-sys-color-surface-container-low: #1A1A1A;
            --md-sys-color-surface-container: #222222;
            --md-sys-color-surface-container-high: #2A2A2A;
            --md-sys-color-surface-container-highest: #323232;

            --md-sys-color-outline: #3A5A3A;
            --md-sys-color-outline-variant: #2A3A2A;

            --md-sys-color-error: #CF6679;
            --md-sys-color-on-error: #121212;

            --md-sys-elevation-1: 0 1px 3px rgba(0, 0, 0, 0.6), 0 1px 2px rgba(0, 0, 0, 0.4);
            --md-sys-elevation-2: 0 1px 3px rgba(0, 0, 0, 0.7), 0 2px 6px 2px rgba(0, 0, 0, 0.4);
            --md-sys-elevation-3: 0 1px 4px rgba(0, 0, 0, 0.8), 0 4px 10px 4px rgba(0, 0, 0, 0.3);

            --md-shape-xs: 4px;
            --md-shape-sm: 8px;
            --md-shape-md: 12px;
            --md-shape-lg: 16px;
            --md-shape-xl: 28px;
            --md-shape-full: 999px;

            --md-font-brand: 'Roboto Flex', 'Roboto', sans-serif;
            --md-font-plain: 'Roboto', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            font-family: var(--md-font-plain);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .material-symbols-rounded {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 24px;
            line-height: 1;
            user-select: none;
        }

        /* ---------- Top App Bar ---------- */
        .top-app-bar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
            height: 64px;
            padding: 0 16px;
            background: var(--md-sys-color-surface-container);
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
        }

        .top-app-bar__logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--md-sys-color-on-surface);
        }

        .top-app-bar__logo .material-symbols-rounded {
            font-size: 28px;
            color: var(--md-sys-color-primary);
        }

        .top-app-bar__title {
            font-family: var(--md-font-brand);
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.01em;
            margin: 0;
        }

        .top-app-bar__title span {
            color: var(--md-sys-color-primary);
        }

        .top-app-bar__spacer {
            flex: 1;
        }

        /* ---------- GitHub icon button (top app bar) ---------- */
        .github-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--md-sys-color-outline-variant);
            background: var(--md-sys-color-surface-container-high);
            color: var(--md-sys-color-on-surface);
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, transform 0.15s;
            flex-shrink: 0;
        }

        .github-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .github-btn:hover {
            background: var(--md-sys-color-secondary-container);
            border-color: var(--md-sys-color-secondary);
            color: var(--md-sys-color-on-secondary-container);
        }

        .github-btn:active {
            transform: scale(0.94);
        }

        /* ---------- Content ---------- */
        .content {
            max-width: 860px;
            margin: 0 auto;
            padding: 16px 20px 32px;
        }

        .page {
            animation: fade-in 0.2s ease;
        }

        @keyframes fade-in {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .page {
                animation: none;
            }
        }

        .page__header {
            margin-bottom: 20px;
        }

        .page__title {
            font-family: var(--md-font-brand);
            font-size: 28px;
            font-weight: 700;
            line-height: 1.2;
            margin: 0 0 4px;
            color: var(--md-sys-color-on-surface);
        }

        .page__subtitle {
            font-size: 14px;
            color: var(--md-sys-color-on-surface-variant);
            margin: 0;
        }

        /* ---------- Search Bar ---------- */
        .search-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            height: 52px;
            padding: 0 16px;
            border-radius: var(--md-shape-full);
            background: var(--md-sys-color-surface-container-high);
            color: var(--md-sys-color-on-surface-variant);
            margin-bottom: 20px;
            border: 1px solid var(--md-sys-color-outline-variant);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-bar:focus-within {
            border-color: var(--md-sys-color-primary);
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.25);
        }

        .search-bar .material-symbols-rounded {
            color: var(--md-sys-color-primary);
        }

        .search-bar input {
            border: none;
            background: transparent;
            outline: none;
            font-size: 16px;
            flex: 1;
            color: var(--md-sys-color-on-surface);
            font-family: var(--md-font-plain);
        }

        .search-bar input::placeholder {
            color: var(--md-sys-color-on-surface-variant);
            opacity: 0.7;
        }

        .search-bar__clear {
            background: none;
            border: none;
            color: var(--md-sys-color-on-surface-variant);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.15s;
        }

        .search-bar__clear:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        /* ---------- Platform filter (All / Mobile / PC) ---------- */
        .platform-filter {
            display: flex;
            justify-content: center;
            gap: 6px;
            max-width: 320px;
            margin: 18px auto 0;
            padding: 4px;
            background: var(--md-sys-color-surface-container-low);
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: var(--md-shape-full);
        }

        .platform-filter__btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 12px;
            border-radius: var(--md-shape-full);
            border: none;
            background: transparent;
            color: var(--md-sys-color-on-surface-variant);
            font-family: var(--md-font-plain);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .platform-filter__btn .material-symbols-rounded {
            font-size: 16px;
        }

        .platform-filter__btn.is-active {
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
        }

        /* ---------- Category sections (homepage browse view) ---------- */
        .category-section {
            margin-bottom: 28px;
        }

        .category-section__title {
            display: flex;
            align-items: baseline;
            gap: 8px;
            font-family: var(--md-font-brand);
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--md-sys-color-on-surface);
        }

        .category-section__count {
            font-size: 12px;
            font-weight: 500;
            color: var(--md-sys-color-on-surface-variant);
        }

        /* ---------- Filter Pills ---------- */
        .filter-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .filter-pill {
            padding: 4px 14px;
            border-radius: var(--md-shape-full);
            border: 1px solid var(--md-sys-color-outline);
            background: transparent;
            font-size: 13px;
            font-weight: 500;
            font-family: var(--md-font-plain);
            color: var(--md-sys-color-on-surface-variant);
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }

        .filter-pill:hover {
            background: var(--md-sys-color-surface-container-highest);
        }

        .filter-pill.is-active {
            background: var(--md-sys-color-secondary-container);
            border-color: var(--md-sys-color-secondary);
            color: var(--md-sys-color-on-secondary-container);
        }

        /* ---------- Tools Grid ---------- */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px;
            margin-top: 4px;
        }

        .tool-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 14px 16px;
            border-radius: var(--md-shape-lg);
            background: var(--md-sys-color-surface-container-low);
            border: 1px solid var(--md-sys-color-outline-variant);
            cursor: pointer;
            transition: background 0.15s, box-shadow 0.15s, transform 0.15s;
            text-decoration: none;
            color: var(--md-sys-color-on-surface);
        }

        .tool-card:hover {
            background: var(--md-sys-color-surface-container-highest);
            box-shadow: var(--md-sys-elevation-1);
            transform: translateY(-2px);
        }

        .tool-card:active {
            transform: scale(0.98);
        }

        .tool-card__top {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .tool-card__icon {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-radius: var(--md-shape-sm);
            background: var(--md-sys-color-surface-container-highest);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .tool-card__icon img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        .tool-card__icon .material-symbols-rounded {
            font-size: 26px;
            color: var(--md-sys-color-primary);
        }

        .tool-card__top-info {
            flex: 1;
            min-width: 0;
        }

        .tool-card__name {
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tool-card__category {
            font-size: 11px;
            color: var(--md-sys-color-primary);
            font-weight: 500;
        }

        .tool-card__desc {
            font-size: 12px;
            color: var(--md-sys-color-on-surface-variant);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ---------- OS badges ---------- */
        .os-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .os-badge {
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 2px 7px 2px 5px;
            border-radius: var(--md-shape-full);
            background: var(--md-sys-color-surface-container-highest);
            border: 1px solid var(--md-sys-color-outline-variant);
            color: var(--md-sys-color-on-surface-variant);
            font-size: 10px;
            font-weight: 600;
        }

        .os-badge img {
            width: 11px;
            height: 11px;
            display: block;
        }

        .os-badge .material-symbols-rounded {
            font-size: 12px;
            color: var(--md-sys-color-on-surface-variant);
        }

        .tool-card__os-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            font-weight: 600;
            color: var(--md-sys-color-on-surface-variant);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        /* ---------- Visit site footer ---------- */
        .tool-card__footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 2px;
        }

        .tool-card__visit {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 600;
            color: var(--md-sys-color-primary);
            text-decoration: none;
        }

        .tool-card__visit .material-symbols-rounded {
            font-size: 14px;
        }

        /* ---------- Empty State ---------- */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--md-sys-color-on-surface-variant);
        }

        .empty-state .material-symbols-rounded {
            font-size: 48px;
            color: var(--md-sys-color-outline);
            margin-bottom: 12px;
        }

        .empty-state p {
            font-size: 15px;
            margin: 0;
        }

        /* ---------- Mobile Bottom Navigation (Material 3) ---------- */
        .bottom-nav {
            display: none;
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 30;
            height: 72px;
            padding-bottom: env(safe-area-inset-bottom, 0);
            background: var(--md-sys-color-surface-container);
            border-top: 1px solid var(--md-sys-color-outline-variant);
        }

        .bottom-nav__item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            border: none;
            background: transparent;
            cursor: pointer;
            padding: 8px 0 12px;
            color: var(--md-sys-color-on-surface-variant);
            font-family: var(--md-font-plain);
            transition: color 0.2s;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        .bottom-nav__icon {
            width: 56px;
            height: 32px;
            border-radius: var(--md-shape-full);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease;
        }

        .bottom-nav__icon svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .bottom-nav__icon .material-symbols-rounded {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            transition: font-variation-settings 0.2s ease;
        }

        .bottom-nav__label {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        .bottom-nav__item.is-active {
            color: var(--md-sys-color-on-surface);
        }

        .bottom-nav__item.is-active .bottom-nav__icon {
            background: var(--md-sys-color-secondary-container);
        }

        .bottom-nav__item.is-active .bottom-nav__icon .material-symbols-rounded {
            color: var(--md-sys-color-on-secondary-container);
            font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
        }

        .bottom-nav__item:active .bottom-nav__icon {
            background: var(--md-sys-color-surface-container-highest);
        }

        /* ---------- Back to Top Button (Uiverse by waliddu001) ---------- */
        .back-to-top-btn {
            position: fixed;
            bottom: 100px;
            right: 20px;
            z-index: 50;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: rgb(20, 20, 20);
            border: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0px 0px 0px 4px rgba(76, 175, 80, 0.253);
            cursor: pointer;
            transition-duration: 0.3s;
            overflow: hidden;
            position: fixed;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.8);
            transition: opacity 0.3s ease, transform 0.3s ease, background 0.3s, width 0.3s, border-radius 0.3s;
        }

        .back-to-top-btn.visible {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }

        .back-to-top-btn .svgIcon {
            width: 16px;
            transition-duration: 0.3s;
            flex-shrink: 0;
        }

        .back-to-top-btn .svgIcon path {
            fill: white;
        }

        .back-to-top-btn:hover {
            width: 140px;
            border-radius: 50px;
            transition-duration: 0.3s;
            background-color: var(--md-sys-color-primary);
            align-items: center;
            box-shadow: 0px 0px 0px 4px rgba(76, 175, 80, 0.4);
        }

        .back-to-top-btn:hover .svgIcon {
            transition-duration: 0.3s;
            transform: translateY(-200%);
        }

        .back-to-top-btn::before {
            position: absolute;
            bottom: -20px;
            content: "Back to Top";
            color: white;
            font-size: 0px;
            white-space: nowrap;
            transition: font-size 0.3s, bottom 0.3s, opacity 0.3s;
            opacity: 0;
        }

        .back-to-top-btn:hover::before {
            font-size: 13px;
            opacity: 1;
            bottom: unset;
            transition-duration: 0.3s;
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 768px) {
            .bottom-nav {
                display: flex;
            }

            .top-app-bar .github-btn {
                display: none;
            }

            .platform-filter {
                display: none;
            }

            .content {
                padding-bottom: 88px;
            }

            .back-to-top-btn {
                bottom: 96px;
                right: 16px;
            }
        }

        @media (min-width: 769px) {
            .bottom-nav {
                display: none !important;
            }

            .content {
                padding-bottom: 48px;
            }

            .back-to-top-btn {
                bottom: 30px;
                right: 30px;
            }
        }

        @media (max-width: 480px) {
            .content {
                padding: 12px 14px 24px;
            }
            .tools-grid {
                grid-template-columns: 1fr;
            }
            .top-app-bar__title {
                font-size: 17px;
            }
            .page__title {
                font-size: 24px;
            }
            .bottom-nav {
                height: 64px;
            }
            .bottom-nav__label {
                font-size: 10px;
            }
        }

        @media (min-width: 600px) {
            .tools-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }
        }

        /* ---------- Home hero: suggestion slider ---------- */
        .suggestion-slider {
            position: relative;
            margin: 4px 0 28px;
            overflow: hidden;
            -webkit-mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 24px), transparent);
            mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 24px), transparent);
        }

        .suggestion-slider__track {
            display: flex;
            gap: 12px;
            width: max-content;
            animation: slide-left 34s linear infinite;
        }

        .suggestion-slider:hover .suggestion-slider__track {
            animation-play-state: paused;
        }

        @keyframes slide-left {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        @media (prefers-reduced-motion: reduce) {
            .suggestion-slider__track {
                animation: none;
                overflow-x: auto;
            }
        }

        .suggestion-card {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 220px;
            padding: 10px 14px;
            border-radius: var(--md-shape-lg);
            background: var(--md-sys-color-surface-container-low);
            border: 1px solid var(--md-sys-color-outline-variant);
            text-decoration: none;
            color: var(--md-sys-color-on-surface);
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .suggestion-card:hover {
            background: var(--md-sys-color-surface-container-highest);
            border-color: var(--md-sys-color-outline);
        }

        .suggestion-card__icon {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            border-radius: var(--md-shape-sm);
            background: var(--md-sys-color-surface-container-highest);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .suggestion-card__icon img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .suggestion-card__text {
            min-width: 0;
        }

        .suggestion-card__name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .suggestion-card__label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--md-sys-color-primary);
        }

        /* ---------- Home hero: search ---------- */
        .search-hero {
            text-align: center;
            margin-bottom: 20px;
        }

        .search-hero__title {
            font-family: var(--md-font-brand);
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .search-hero__title span {
            color: var(--md-sys-color-primary);
        }

        .search-hero__subtitle {
            font-size: 14px;
            color: var(--md-sys-color-on-surface-variant);
            margin-bottom: 18px;
        }

        .search-bar--hero {
            height: 56px;
            max-width: 560px;
            margin: 0 auto;
            padding: 0 20px;
            background: var(--md-sys-color-surface-container-high);
            box-shadow: var(--md-sys-elevation-1);

        /* ---------- Quick suggestion chips ---------- */
        .quick-suggestions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            max-width: 560px;
            margin: 14px auto 8px;
        }

        .quick-suggestions__label {
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: var(--md-sys-color-on-surface-variant);
            margin-bottom: 2px;
        }

        .quick-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: var(--md-shape-full);
            border: 1px solid var(--md-sys-color-outline-variant);
            background: var(--md-sys-color-surface-container-low);
            color: var(--md-sys-color-on-surface-variant);
            font-family: var(--md-font-plain);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, color 0.15s;

        .quick-chip .material-symbols-rounded {
            font-size: 16px;
        }

        .quick-chip:hover {
            background: var(--md-sys-color-primary-container);
            border-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary-container);
        }

        .browse-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 28px 0 14px;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .browse-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--md-sys-color-outline-variant);
        }

        /* ---------- GitHub "star us" modal ---------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        .modal-overlay.is-open {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            width: 100%;
            max-width: 360px;
            background: var(--md-sys-color-surface-container-high);
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: var(--md-shape-xl);
            padding: 28px 24px 24px;
            text-align: center;
            box-shadow: var(--md-sys-elevation-3);
            transform: scale(0.94) translateY(8px);
            transition: transform 0.2s ease;
        }

        .modal-overlay.is-open .modal-card {
            transform: scale(1) translateY(0);
        }

        .modal-card__icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 14px;
            border-radius: 50%;
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-card__icon svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        .modal-card__title {
            font-family: var(--md-font-brand);
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .modal-card__desc {
            font-size: 14px;
            line-height: 1.5;
            color: var(--md-sys-color-on-surface-variant);
            margin-bottom: 22px;
        }

        .modal-card__actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 44px;
            border-radius: var(--md-shape-full);
            font-family: var(--md-font-plain);

            font-weight: 600;

            text-decoration: none;
            border: none;
            transition: box-shadow 0.15s, background 0.15s;

        .modal-btn--filled {
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
        }

        .modal-btn--filled:hover {
            box-shadow: var(--md-sys-elevation-2);
        }

        .modal-btn--filled svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .modal-btn--text {
            background: transparent;
            color: var(--md-sys-color-on-surface-variant);
        }

        .modal-btn--text:hover {
            background: var(--md-sys-color-surface-container-highest);
        }

        .search-select {
            padding: 6px 14px;
            border-radius: var(--md-shape-full);
            border: 1px solid var(--md-sys-color-outline);
            background: var(--md-sys-color-surface-container);

        }

        }

        .search-select option {
            background: var(--md-sys-color-surface-container);
            color: var(--md-sys-color-on-surface);
        }
    </style>
</head>

                icon: "https://images.sftcdn.net/images/t_app-icon-m/p/26a4fc82-7d40-467b-81de-334cb944e4e2/1851832726/monect-pc-remote-Monect%20PC%20Remote-icon.png",
                category: "Controller / Phone Tools", platforms: ["Windows", "Android", "iOS"],
                desc: "Use your phone as a PC remote/gamepad." },

            // Online Tools
            { id: 32, name: "123apps", url: "https://123apps.com/",
                icon: "https://img.alternativeto.net/icons/140/avif/http--123apps-com-_254932.png",
                category: "Online Tools", platforms: ["Web"], desc: "Online tools for audio, video, PDF." },

            // System / Android Tools
            { id: 33, name: "Android Debloat Package",
                url: "https://github.com/Universal-Debloater-Alliance/universal-android-debloater-next-generation",
                iconSymbol: "android", category: "System / Android Tools", platforms: ["Windows", "Linux"],
                desc: "Remove Android bloatware safely via ADB." },

            // Operating Systems (no OS badges — this IS an OS image)
            { id: 34, name: "Windows 10 ISO", url: "https://www.microsoft.com/software-download/windows10",
                iconSymbol: "album", category: "Operating Systems", platforms: ["Windows"], isOS: true,
                desc: "Official Windows 10 installation image." },
        ];

        // Category display order (matches the catalog spec)
        const CATEGORY_ORDER = [
            "Archive / Compression", "Video / Media", "Display / Utilities", "Office / Productivity",
            "Browsers", "Download Managers", "Torrent", "PDF", "Password Managers", "Screenshots",
            "File Sharing", "Communication", "Gaming", "Controller / Phone Tools", "Online Tools",
            "System / Android Tools", "Operating Systems",
        ];

        // ================================================================
        //  OS BADGE META
        // ================================================================
        const PLATFORM_META = {
            Windows: { label: "Windows", icon: "https://cdn.simpleicons.org/windows/e8eaed", type: "img" },
            Linux: { label: "Linux", icon: "https://cdn.simpleicons.org/linux/e8eaed", type: "img" },
            macOS: { label: "macOS", icon: "https://cdn.simpleicons.org/apple/e8eaed", type: "img" },
            Android: { label: "Android", icon: "https://cdn.simpleicons.org/android/e8eaed", type: "img" },
            iOS: { label: "iOS", icon: "https://cdn.simpleicons.org/apple/e8eaed", type: "img" },
            Web: { label: "Web", icon: "public", type: "symbol" },
        };

        const PC_PLATFORMS = ["Windows", "Linux", "macOS", "Web"];
        const MOBILE_PLATFORMS = ["Android", "iOS"];

        function isPCTool(tool) {
            return tool.platforms.some(p => PC_PLATFORMS.includes(p));
        }
        function isMobileTool(tool) {
            return tool.platforms.some(p => MOBILE_PLATFORMS.includes(p));
        }

        function renderOsBadges(tool) {
            if (tool.isOS) return '';
            return `<div class="os-badges">${tool.platforms.map(p => {
                const meta = PLATFORM_META[p];
                if (!meta) return '';
                const iconHtml = meta.type === 'img'
                    ? `<img src="${meta.icon}" alt="" onerror="this.style.display='none'" />`
                    : `<span class="material-symbols-rounded">${meta.icon}</span>`;
                return `<span class="os-badge" title="${meta.label}">${iconHtml}${meta.label}</span>`;
            }).join('')}</div>`;
        }

        // ================================================================
        //  HELPERS
        // ================================================================
        function escapeHtml(str) {
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]);
        }

        function renderToolCard(tool) {
            const iconHtml = tool.iconSymbol
                ? `<span class="material-symbols-rounded">${tool.iconSymbol}</span>`
                : `<img src="${escapeHtml(tool.icon)}" onerror="this.src='https://placehold.co/44x44/2c2c2c/4CAF50?text=?'" alt="" />`;

            return `
            <div class="tool-card" data-url="${escapeHtml(tool.url)}">
              <div class="tool-card__top">
                <div class="tool-card__icon">${iconHtml}</div>
                <div class="tool-card__top-info">
                  <div class="tool-card__name">${escapeHtml(tool.name)}</div>
                  <div class="tool-card__category">${escapeHtml(tool.category)}</div>
                </div>
              </div>
              <div class="tool-card__desc">${escapeHtml(tool.desc)}</div>
              ${tool.isOS
                  ? '<span class="tool-card__os-tag"><span class="material-symbols-rounded" style="font-size:13px;">info</span>OS install image — no platform badges</span>'
                  : renderOsBadges(tool)}
              <div class="tool-card__footer">
                <a class="tool-card__visit" href="${escapeHtml(tool.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation();">
                  Official site <span class="material-symbols-rounded">open_in_new</span>
                </a>
              </div>
            </div>
          `;
        }

        function renderTools(gridId, tools) {
            const grid = document.getElementById(gridId);
            if (!grid) return;
            if (!tools || tools.length === 0) {
                grid.innerHTML = `
              <div class="empty-state">
                <span class="material-symbols-rounded">search_off</span>
                <p>No tools found</p>
              </div>
            `;
                return;
            }
            grid.innerHTML = tools.map(renderToolCard).join('');
            grid.querySelectorAll('.tool-card').forEach(card => {
                card.addEventListener('click', () => {
                    window.open(card.dataset.url, '_blank');
                });
            });
        }

        // Relevance score for a single tool against a tokenized query.
        // Returns 0 if any token fails to match anywhere (AND matching across words),
        // otherwise a positive score used to rank the best matches first.
        function scoreTool(tool, tokens) {
            const name = tool.name.toLowerCase();
            const desc = tool.desc.toLowerCase();
            const cat = tool.category.toLowerCase();
            let score = 0;

            for (const tok of tokens) {
                let tokenScore = 0;
                if (name === tok) tokenScore = 100;
                else if (name.startsWith(tok)) tokenScore = 60;
                else if (name.includes(tok)) tokenScore = 35;
                else if (cat === tok) tokenScore = 30;
                else if (cat.includes(tok)) tokenScore = 18;
                else if (desc.includes(tok)) tokenScore = 8;

                if (tokenScore === 0) return 0; // every word must match somewhere
                score += tokenScore;
            }
            return score;
        }

        function searchTools(tools, query) {
            const tokens = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
            return tools
                .map(t => ({ t, score: scoreTool(t, tokens) }))
                .filter(r => r.score > 0)
                .sort((a, b) => b.score - a.score)
                .map(r => r.t);
        }

        // Small debounce helper so typing feels smooth even while re-rendering grids.
        function debounce(fn, wait) {
            let timer = null;
            return function (...args) {
                clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, args), wait);
            };
        }

        // ================================================================
        //  STATE
        // ================================================================
        let homeQuery = '';
        let platformFilter = 'all'; // 'all' | 'mobile' | 'pc'

        // ================================================================
        //  RENDER: HOME
        // ================================================================
        function toolsForPlatformFilter() {
            if (platformFilter === 'mobile') return toolsDatabase.filter(isMobileTool);
            if (platformFilter === 'pc') return toolsDatabase.filter(isPCTool);
            return toolsDatabase; // 'all' — mixed PC + mobile
        }

        function renderCategorySections(tools) {
            const container = document.getElementById('categorySections');
            const byCategory = new Map();
            tools.forEach(t => {
                if (!byCategory.has(t.category)) byCategory.set(t.category, []);
                byCategory.get(t.category).push(t);
            });

            const orderedCats = CATEGORY_ORDER.filter(c => byCategory.has(c));
            if (orderedCats.length === 0) {
                container.innerHTML = `
              <div class="empty-state">
                <span class="material-symbols-rounded">search_off</span>
                <p>No tools found for this filter</p>
              </div>
            `;
                return;
            }

            container.innerHTML = orderedCats.map(cat => {
                const items = byCategory.get(cat);
                return `
              <div class="category-section">
                <div class="category-section__title">${escapeHtml(cat)}
                  <span class="category-section__count">(${items.length})</span>
                </div>
                <div class="tools-grid">${items.map(renderToolCard).join('')}</div>
              </div>
            `;
            }).join('');

            container.querySelectorAll('.tool-card').forEach(card => {
                card.addEventListener('click', () => {
                    window.open(card.dataset.url, '_blank');
                });
            });
        }

        function renderHome() {
            const homeGrid = document.getElementById('homeGrid');
            const categorySections = document.getElementById('categorySections');
            const browseDivider = document.getElementById('browseDivider');
            const base = toolsForPlatformFilter();

            if (homeQuery && homeQuery.trim()) {
                // Flat, relevance-ranked search results
                homeGrid.hidden = false;
                categorySections.hidden = true;
                browseDivider.hidden = true;
                renderTools('homeGrid', searchTools(base, homeQuery));
            } else {
                // Default grouped-by-category browse view
                homeGrid.hidden = true;
                categorySections.hidden = false;
                browseDivider.hidden = false;
                renderCategorySections(base);
            }
        }

        // ================================================================
        //  PLATFORM FILTER (All / Mobile / PC) — desktop segmented control
        //  and mobile bottom nav both drive/reflect the same state.
        // ================================================================
        document.querySelectorAll('.platform-filter__btn[data-platform], .bottom-nav__item[data-platform]').forEach(btn => {
            btn.addEventListener('click', () => {
                platformFilter = btn.dataset.platform;
                document.querySelectorAll('.platform-filter__btn[data-platform], .bottom-nav__item[data-platform]').forEach(b =>
                    b.classList.toggle('is-active', b.dataset.platform === platformFilter));
                renderHome();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });

        // ================================================================
        //  GITHUB "STAR US" MODAL
        // ================================================================
        const githubModal = document.getElementById('githubModal');

        function openGithubModal() {
            githubModal.classList.add('is-open');
        }
        function closeGithubModal() {
            githubModal.classList.remove('is-open');
        }

        document.getElementById('githubTopBtn').addEventListener('click', openGithubModal);
        document.getElementById('githubBottomBtn').addEventListener('click', openGithubModal);
        document.getElementById('githubModalClose').addEventListener('click', closeGithubModal);
        githubModal.addEventListener('click', (e) => {
            if (e.target === githubModal) closeGithubModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && githubModal.classList.contains('is-open')) closeGithubModal();
        });

        // ================================================================
        //  SCROLL: Back to Top visibility
        // ================================================================
        const backToTopBtn = document.getElementById('backToTopBtn');

        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                backToTopBtn.classList.add('visible');
            } else {
                backToTopBtn.classList.remove('visible');
            }
        });

        backToTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // ================================================================
        //  SEARCH BINDINGS (debounced for smooth typing)
        // ================================================================
        const homeInput = document.getElementById('homeSearchInput');
        const homeClear = document.getElementById('homeSearchClear');
        const debouncedRenderHome = debounce(renderHome, 120);
        homeInput.addEventListener('input', () => { homeQuery = homeInput.value;
            debouncedRenderHome(); });
        homeClear.addEventListener('click', () => { homeInput.value = '';
            homeQuery = '';
            renderHome();
            homeInput.focus(); });

        // ================================================================
        //  HOME HERO: suggestion slider + quick-search chips
        // ================================================================
        const FEATURED_IDS = [13, 14, 21, 4, 19, 26, 3, 9];

        function renderSuggestionSlider() {
            const track = document.getElementById('suggestionTrack');
            const featured = FEATURED_IDS
                .map(id => toolsDatabase.find(t => t.id === id))
                .filter(Boolean);
            if (!featured.length || !track) return;

            const cardHtml = (tool) => {
                const iconHtml = tool.iconSymbol
                    ? `<span class="material-symbols-rounded">${tool.iconSymbol}</span>`
                    : `<img src="${escapeHtml(tool.icon)}" onerror="this.src='https://placehold.co/36x36/2c2c2c/4CAF50?text=?'" alt="" />`;
                return `
              <div class="suggestion-card" data-url="${escapeHtml(tool.url)}">
                <div class="suggestion-card__icon">${iconHtml}</div>
                <div class="suggestion-card__text">
                  <div class="suggestion-card__label">Featured</div>
                  <div class="suggestion-card__name">${escapeHtml(tool.name)}</div>
                </div>
              </div>
            `;
            };
            // Duplicate the list so the CSS marquee loop is seamless.
            track.innerHTML = featured.map(cardHtml).join('') + featured.map(cardHtml).join('');
            track.querySelectorAll('.suggestion-card').forEach(card => {
                card.addEventListener('click', () => window.open(card.dataset.url, '_blank'));
            });
        }

        const QUICK_SUGGESTIONS = [
            { label: 'Browsers', icon: 'public', query: 'browsers' },
            { label: 'PDF tools', icon: 'picture_as_pdf', query: 'pdf' },
            { label: 'Password manager', icon: 'password', query: 'password' },
            { label: 'Screenshots', icon: 'screenshot_monitor', query: 'screenshot' },
            { label: 'Gaming', icon: 'sports_esports', query: 'gaming' },
        ];

        function renderQuickSuggestions() {
            const container = document.getElementById('quickSuggestions');
            const chipsHtml = QUICK_SUGGESTIONS.map(s => `
              <button class="quick-chip" data-query="${escapeHtml(s.query)}">
                <span class="material-symbols-rounded">${s.icon}</span>${escapeHtml(s.label)}
              </button>
            `).join('');
            container.insertAdjacentHTML('beforeend', chipsHtml);
            container.querySelectorAll('.quick-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    homeInput.value = chip.dataset.query;
                    homeQuery = chip.dataset.query;
                    renderHome();
                    homeInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
                });
            });
        }

        // ================================================================
        //  INIT
        // ================================================================
        renderSuggestionSlider();
        renderQuickSuggestions();
        renderHome();
    </script>


</body>
</html>
