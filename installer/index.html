<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<script>
(function() {
  try {
    if (localStorage.getItem('taratan_theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  } catch (e) {}
})();
</script>

<title>TaraTari Installer — Bulk App Installer</title>
<meta name="description" content="Pick your apps. Get one installer. No bloatware, no dependencies.">
<link rel="canonical" href="https://tarataritools.github.io/installer/">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

<style>
:root {
  --bg: #09090b;
  --surface: #131316;
  --surface-2: #1c1c20;
  --surface-3: #26262b;
  --border: #27272a;
  --border-hover: #3f3f46;
  --text: #e4e4e7;
  --text-muted: #a1a1aa;
  --text-dim: #71717a;
  --accent: #4ade80;
  --accent-hover: #22c55e;
  --accent-bright: #66ff66;
  --accent-bright-hover: #85ff85;
  --accent-soft: rgba(74, 222, 128, 0.12);
  --on-accent: #000000;
  --header-bg: rgba(9, 9, 11, 0.85);
  --bottom-nav-bg: rgba(9, 9, 11, 0.95);
  --radius: 10px;
  --radius-lg: 14px;
  --radius-full: 999px;
  --font: 'Inter', system-ui, -apple-system, sans-serif;
  --mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
}

:root[data-theme="light"] {
  --bg: #fafafa;
  --surface: #ffffff;
  --surface-2: #f4f4f5;
  --surface-3: #e4e4e7;
  --border: #e4e4e7;
  --border-hover: #d4d4d8;
  --text: #18181b;
  --text-muted: #52525b;
  --text-dim: #71717a;
  --accent: #16a34a;
  --accent-hover: #15803d;
  --accent-bright: #4ade80;
  --accent-bright-hover: #86efac;
  --accent-soft: rgba(22, 163, 74, 0.10);
  --on-accent: #000000;
  --header-bg: rgba(250, 250, 250, 0.88);
  --bottom-nav-bg: rgba(250, 250, 250, 0.96);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  transition: background-color 0.25s ease, color 0.25s ease;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.container { max-width: 960px; margin: 0 auto; padding: 0 20px; }

.material-symbols-rounded {
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  font-size: 20px;
  line-height: 1;
  user-select: none;
  vertical-align: middle;
}

/* Page loader */
.page-loader {
  position: fixed; inset: 0; background: var(--bg); z-index: 9999;
  display: grid; place-items: center;
  transition: opacity 0.45s ease, visibility 0.45s ease;
}
.page-loader.done { opacity: 0; visibility: hidden; pointer-events: none; }

.bolt-loader {
  --bl-size: 96px;
  --bl-green: var(--accent-bright, #66ff66);
  --bl-glow: rgba(102, 255, 102, 0.55);
  position: relative; width: var(--bl-size); height: var(--bl-size);
  display: grid; place-items: center;
  animation: bl-breathe 2.4s ease-in-out infinite;
}
:root[data-theme="light"] .bolt-loader { --bl-glow: rgba(74, 222, 128, 0.45); }
.bolt-loader::before {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  border: 1.5px solid transparent; border-top-color: var(--bl-green);
  filter: drop-shadow(0 0 5px var(--bl-glow));
  animation: bl-spin 1.4s linear infinite;
}
.bolt-loader__bolt {
  width: 40%; height: 40%; fill: var(--bl-green);
  filter: drop-shadow(0 0 6px var(--bl-glow));
  animation: bl-zap 2.4s ease-in-out infinite;
}
@keyframes bl-spin { to { transform: rotate(360deg); } }
@keyframes bl-breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
@keyframes bl-zap { 0%,88%,100%{opacity:1} 90%{opacity:.25} 92%{opacity:1} 94%{opacity:.4} 96%{opacity:1} }

/* Header */
.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--header-bg);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.header__inner { display: flex; align-items: center; gap: 12px; height: 60px; }

.logo {
  display: flex; align-items: center; gap: 10px;
  color: var(--text); font-weight: 700; font-size: 17px;
  letter-spacing: -0.01em; text-decoration: none; flex-shrink: 0;
}
.logo:hover { text-decoration: none; }
.logo img { height: 32px; width: auto; border-radius: 6px; }
.logo__text {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}
.logo__spacer { flex: 1; }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text); cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  flex-shrink: 0;
}
.icon-btn:hover { background: var(--surface-3); border-color: var(--border-hover); }
.icon-btn .material-symbols-rounded { font-size: 20px; }

/* Hero */
.hero { padding: 56px 0 36px; text-align: center; }
.hero h1 {
  font-size: clamp(28px, 5vw, 44px);
  font-weight: 800; line-height: 1.15; letter-spacing: -0.03em;
  margin-bottom: 12px;
}
.hero__sub {
  font-size: clamp(14px, 2vw, 17px);
  color: var(--text-muted); max-width: 580px; margin: 0 auto 28px; line-height: 1.6;
}

/* Search */
.search {
  display: flex; align-items: center; gap: 10px;
  max-width: 560px; margin: 0 auto; padding: 0 16px; height: 52px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search .material-symbols-rounded { color: var(--text-dim); font-size: 20px; }
.search input {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text); font-family: var(--font); font-size: 15px; min-width: 0;
}
.search input::placeholder { color: var(--text-dim); }
.search__clear {
  background: none; border: none; color: var(--text-dim);
  cursor: pointer; padding: 4px; display: flex; align-items: center;
  border-radius: 4px; transition: color 0.15s;
}
.search__clear:hover { color: var(--text); }

/* Category chips */
.chips-wrap {
  position: sticky; top: 60px; z-index: 40;
  background: var(--bg); padding: 10px 0 14px; margin-bottom: 8px;
  transition: background-color 0.25s ease;
}
.chips {
  display: flex; gap: 6px; overflow-x: auto;
  scrollbar-width: none; -ms-overflow-style: none; padding: 2px 4px;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text-muted);
  font-family: var(--font); font-size: 13px; font-weight: 500;
  border-radius: var(--radius-full); cursor: pointer; white-space: nowrap;
  transition: background 0.15s, color 0.15s, border-color 0.15s; flex-shrink: 0;
}
.chip:hover { color: var(--text); border-color: var(--border-hover); }
.chip.active {
  background: var(--accent-bright); color: #000;
  border-color: var(--accent-bright); font-weight: 600;
}
.chip .count { font-size: 11px; opacity: 0.65; font-weight: 600; }

/* App grid */
.app-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 10px;
  padding-bottom: 120px;
}

.app-card {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 16px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  cursor: pointer; text-align: left;
  font-family: var(--font); color: var(--text);
  transition: border-color 0.15s, background 0.15s, transform 0.1s;
  position: relative;
}
.app-card:hover { border-color: var(--border-hover); background: var(--surface-2); }
.app-card:active { transform: scale(0.995); }
.app-card.selected { border-color: var(--accent); background: var(--accent-soft); }

.app-card__check {
  position: absolute; top: 12px; right: 12px;
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid var(--border); background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, border-color 0.15s;
}
.app-card.selected .app-card__check {
  background: var(--accent-bright); border-color: var(--accent-bright);
}
.app-card__check .material-symbols-rounded {
  font-size: 14px; color: #000; display: none;
}
.app-card.selected .app-card__check .material-symbols-rounded { display: block; }

.app-card__icon {
  flex-shrink: 0; width: 40px; height: 40px;
  border-radius: 8px; background: var(--surface-3);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.app-card__icon .material-symbols-rounded { font-size: 22px; color: var(--accent); }

.app-card__body { flex: 1; min-width: 0; padding-right: 20px; }
.app-card__name {
  font-size: 14px; font-weight: 600; color: var(--text);
  margin-bottom: 2px; line-height: 1.3;
}
.app-card__cat {
  font-size: 11px; color: var(--text-dim); margin-bottom: 6px;
}
.app-card__fallback {
  font-size: 10px; color: var(--text-dim);
  display: inline-flex; align-items: center; gap: 3px;
  margin-top: 4px;
}
.app-card__fallback .material-symbols-rounded { font-size: 12px; }

/* Empty */
.empty {
  grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-dim);
}
.empty .material-symbols-rounded { font-size: 44px; margin-bottom: 12px; display: block; }

/* Sticky bottom bar */
.bottom-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  background: var(--bottom-nav-bg);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--border);
  padding: 14px 20px calc(14px + env(safe-area-inset-bottom, 0));
}
.bottom-bar__inner {
  max-width: 960px; margin: 0 auto;
  display: flex; align-items: center; gap: 16px;
}
.bottom-bar__count {
  font-size: 14px; font-weight: 600; color: var(--text-muted); flex: 1;
}
.bottom-bar__count strong { color: var(--text); }
.cta-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 28px; border: none; border-radius: var(--radius-full);
  background: var(--accent-bright); color: #000;
  font-family: var(--font); font-size: 15px; font-weight: 700;
  cursor: pointer; text-decoration: none;
  transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
}
.cta-btn:hover { background: var(--accent-bright-hover); box-shadow: 0 0 22px rgba(102,255,102,0.4); text-decoration: none; }
:root[data-theme="light"] .cta-btn:hover { box-shadow: 0 4px 18px rgba(74,222,128,0.45); }
.cta-btn:active { transform: scale(0.98); }
.cta-btn:disabled {
  background: var(--surface-3); color: var(--text-dim); cursor: not-allowed;
  box-shadow: none;
}

/* Footer */
.footer {
  margin-top: 20px; padding: 28px 0 calc(28px + env(safe-area-inset-bottom, 0));
  border-top: 1px solid var(--border); text-align: center;
}
.footer p { font-size: 13px; color: var(--text-dim); }

/* Mobile */
@media (max-width: 768px) {
  .header__inner { height: 56px; }
  .logo img { height: 28px; }
  .hero { padding: 32px 0 24px; }
  .hero h1 { font-size: clamp(24px, 7vw, 36px); }
  .search { height: 48px; padding: 0 14px; }
  .chips-wrap { top: 56px; margin: 0 -20px 6px; padding-left: 20px; padding-right: 20px; }
  .app-grid { grid-template-columns: 1fr; }
  .bottom-bar__inner { flex-direction: column; gap: 10px; }
  .bottom-bar__count { text-align: center; }
  .cta-btn { width: 100%; }
}
</style>
</head>
<body>

<!-- Loader -->
<div class="page-loader" id="pageLoader" role="status" aria-label="Loading">
  <div class="bolt-loader">
    <svg class="bolt-loader__bolt" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12l1-8.5Z"/>
    </svg>
  </div>
</div>

<!-- Header -->
<header class="header">
  <div class="container header__inner">
    <a href="/" class="logo" aria-label="TaraTariTools home">
      <img src="https://raw.githubusercontent.com/tarataritools/tarataritools.github.io/main/images/TaraTariToolsLogo.png" alt="TaraTariTools logo" onerror="this.remove()">
      <span class="logo__text">TaraTariTools</span>
    </a>
    <span class="logo__spacer"></span>
    <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
      <span class="material-symbols-rounded" id="themeIcon">dark_mode</span>
    </button>
  </div>
</header>

<main>
  <section class="hero">
    <div class="container">
      <h1>TaraTari Installer</h1>
      <p class="hero__sub">Pick your apps. Get one installer. No bloatware, no dependencies, no nonsense.</p>
      <div class="search">
        <span class="material-symbols-rounded">search</span>
        <input type="text" id="searchInput" placeholder="Search apps or categories…" aria-label="Search apps">
        <button class="search__clear" id="searchClear" aria-label="Clear search" hidden>
          <span class="material-symbols-rounded" style="font-size:18px;">close</span>
        </button>
      </div>
    </div>
  </section>

  <div class="chips-wrap">
    <div class="container" style="padding:0 20px;">
      <div class="chips" id="chips" role="tablist" aria-label="Filter by category"></div>
    </div>
  </div>

  <div class="container">
    <div class="app-grid" id="appGrid"></div>
  </div>
</main>

<div class="bottom-bar">
  <div class="bottom-bar__inner">
    <span class="bottom-bar__count" id="countLabel">0 apps selected</span>
    <button class="cta-btn" id="generateBtn" disabled>
      <span class="material-symbols-rounded">download</span>
      Get Installer
    </button>
  </div>
</div>

<footer class="footer">
  <div class="container">
    <p>Part of <a href="/">TaraTariTools</a> · hand-picked, no affiliates.</p>
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>
