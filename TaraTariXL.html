<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaraTari XL</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root,[data-theme="light"]{
  --bg:#ffffff;--surface:#f3f3f3;--surface2:#e6e6e6;--surface3:#d4d4d4;
  --border:#d4d4d4;--border2:#b0b0b0;
  --text:#1a1a1a;--dim:#555;--dim2:#888;--accent:#10b981;--danger:#e5484d;
  --cell-border:#e6e6e6;--cell-sel:rgba(16,185,129,.15);
  --cell-active:rgba(16,185,129,.25);--cell-edit:#ffffff;
  --grid-header:#f3f3f3;--grid-header-active:#e6e6e6;
  --shadow:rgba(0,0,0,.1);
}
[data-theme="dark"]{
  --bg:#1e1e1e;--surface:#252526;--surface2:#333333;--surface3:#454545;
  --border:#3e3e42;--border2:#555555;
  --text:#cccccc;--dim:#999;--dim2:#777;--accent:#6ee7b7;--danger:#e5484d;
  --cell-border:#2d2d2d;--cell-sel:rgba(110,231,183,.15);
  --cell-active:rgba(110,231,183,.25);--cell-edit:#1e1e1e;
  --grid-header:#252526;--grid-header-active:#333333;
  --shadow:rgba(0,0,0,.4);
}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);transition:background .15s,color .15s;font-size:13px}
button{font-family:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:flex;flex-direction:column;height:100vh}

/* Top Title Bar */
.titlebar{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:var(--surface);border-bottom:1px solid var(--border)}
.titlebar-left,.titlebar-right{display:flex;align-items:center;gap:8px}
.titlebar-center{font-weight:600;font-size:13px;color:var(--dim)}
.tb-icon{background:transparent;border:none;width:28px;height:28px;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--dim);transition:.15s}
.tb-icon:hover{background:var(--surface2);color:var(--text)}
.tb-icon:disabled{opacity:.3;cursor:not-allowed}
.tb-icon svg{width:16px;height:16px;fill:currentColor}

/* Ribbon Tabs */
.tabs{display:flex;background:var(--surface);padding:0 12px;border-bottom:1px solid var(--border);user-select:none}
.tab{padding:8px 16px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;color:var(--dim);font-weight:500}
.tab:hover{color:var(--text);background:var(--surface2)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--bg)}
[data-theme="dark"] .tab.active{color:var(--accent)}

/* Ribbon Toolbar */
.ribbon{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--border);flex-wrap:wrap;min-height:52px;box-shadow:0 1px 2px var(--shadow);z-index:10}
.ribbon-group{display:flex;align-items:center;gap:4px;padding-right:8px;border-right:1px solid var(--border)}
.ribbon-group:last-child{border-right:none}
.ribbon-btn{background:transparent;border:1px solid transparent;width:30px;height:30px;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);transition:.1s}
.ribbon-btn:hover{background:var(--surface2);border-color:var(--border2)}
.ribbon-btn.active{background:var(--surface3);border-color:var(--border2)}
.ribbon-btn svg{width:15px;height:15px;fill:currentColor}
.ribbon-select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font-size:12px;outline:none;cursor:pointer}
.ribbon-select:hover{border-color:var(--border2)}

/* File Menu Dropdown */
.file-menu{position:absolute;top:68px;left:12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px var(--shadow);min-width:220px;padding:6px;z-index:100;display:none}
.file-menu.show{display:block}
.file-menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border:none;background:transparent;color:var(--text);text-align:left;border-radius:4px;cursor:pointer;font-size:13px}
.file-menu-item:hover{background:var(--surface2)}
.file-menu-sep{height:1px;background:var(--border);margin:4px 0}
.file-menu-sub{padding-left:24px;font-size:12px;color:var(--dim)}

/* Formula Bar */
.formulabar{display:flex;align-items:center;gap:8px;padding:4px 8px;background:var(--surface);border-bottom:1px solid var(--border)}
.formulabar .ref{font:600 12px ui-monospace,monospace;color:var(--dim);min-width:56px;text-align:center;padding:4px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.formulabar .fx{font-style:italic;color:var(--dim2);font-size:12px;padding:0 4px;border-left:1px solid var(--border);border-right:1px solid var(--border);margin:0 4px}
.formulabar input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);font:13px ui-monospace,monospace;padding:4px 8px;border-radius:4px;outline:none}
.formulabar input:focus{border-color:var(--accent)}

/* Grid */
.gridwrap{flex:1;overflow:auto;background:var(--bg);position:relative}
table.sheet{border-collapse:separate;border-spacing:0;font:13px inherit;table-layout:fixed;min-width:100%}
table.sheet th{background:var(--grid-header);color:var(--dim);font-weight:600;text-align:center;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:0;font-size:11px;height:26px;user-select:none;position:sticky}
table.sheet thead th{top:0;z-index:2;min-width:90px}
table.sheet tbody th{left:0;z-index:1;min-width:40px;width:40px}
table.sheet thead th.corner{position:sticky;top:0;left:0;z-index:3;min-width:40px;width:40px}
table.sheet td{border-right:1px solid var(--cell-border);border-bottom:1px solid var(--cell-border);padding:0;height:28px;background:var(--bg);position:relative;cursor:cell}
table.sheet.no-borders td{border-color:transparent}
table.sheet td.sel{background:var(--cell-sel)}
table.sheet td.active{background:var(--cell-active)}
table.sheet td.fill-preview{background:var(--cell-sel);outline:1px dashed var(--accent);outline-offset:-1px}

/* The Input - hidden until editing */
table.sheet td input{width:100%;height:100%;background:transparent;border:none;color:var(--text);font:13px inherit;padding:0 8px;outline:none;box-sizing:border-box;pointer-events:none;user-select:none}
table.sheet td input.editing{pointer-events:auto;user-select:text;background:var(--cell-edit);box-shadow:inset 0 0 0 2px var(--accent);z-index:5;position:absolute;top:0;left:0;cursor:text}
table.sheet td input.bold{font-weight:700}
table.sheet td input.italic{font-style:italic}
table.sheet td input.underline{text-decoration:underline}
table.sheet td input.align-center{text-align:center}
table.sheet td input.align-right{text-align:right}
table.sheet td input.num{text-align:right}
table.sheet td input.err{color:var(--danger)}

.fill-handle{position:absolute;right:-4px;bottom:-4px;width:7px;height:7px;background:var(--accent);border:1px solid var(--bg);cursor:crosshair;z-index:6;border-radius:1px;padding:0;pointer-events:auto;display:none}
table.sheet td.active .fill-handle{display:block}
.fill-handle:hover{transform:scale(1.4)}

/* Status */
.status{padding:4px 12px;background:var(--surface);border-top:1px solid var(--border);font-size:11.5px;color:var(--dim);display:flex;justify-content:space-between;gap:10px;user-select:none}
#fileInput{display:none}
</style>
</head>
<body>

<div class="app">
  <!-- Title Bar -->
  <div class="titlebar">
    <div class="titlebar-left">
      <button class="tb-icon" id="tbNew" title="New"><svg viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg></button>
      <button class="tb-icon" id="tbPrint" title="Export PDF"><svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg></button>
      <button class="tb-icon" id="tbSave" title="Save to Browser"><svg viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg></button>
      <div style="width:1px;height:16px;background:var(--border);margin:0 4px"></div>
      <button class="tb-icon" id="tbUndo" title="Undo"><svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05 1-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg></button>
      <button class="tb-icon" id="tbRedo" title="Redo"><svg viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 9 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.06-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg></button>
    </div>
    <div class="titlebar-center">Book1.xlsx</div>
    <div class="titlebar-right">
      <button class="tb-icon" id="tbTheme" title="Toggle Theme">
        <svg id="themeIcon" viewBox="0 0 24 24"><path d="M12 18a6 6 0 1 1 0-12 6 6 0 0 1 0 12zm0-2a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg>
      </button>
    </div>
  </div>

  <!-- Ribbon Tabs -->
  <div class="tabs">
    <div class="tab" id="tabFile">File</div>
    <div class="tab active">Home</div>
    <div class="tab">Insert</div>
    <div class="tab">View</div>
  </div>

  <!-- File Menu Dropdown -->
  <div class="file-menu" id="fileMenu">
    <button class="file-menu-item" id="menuNew"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg> New</button>
    <button class="file-menu-item" id="menuImport"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg> Import...</button>
    <div class="file-menu-sep"></div>
    <div class="file-menu-sub">Save As</div>
    <button class="file-menu-item file-menu-sub" id="menuSaveXlsx">Excel (.xlsx)</button>
    <button class="file-menu-item file-menu-sub" id="menuSaveCsv">Comma Separated (.csv)</button>
    <button class="file-menu-item file-menu-sub" id="menuSavePdf">PDF Document (.pdf)</button>
  </div>

  <!-- Ribbon Toolbar -->
  <div class="ribbon">
    <div class="ribbon-group">
      <select class="ribbon-select" style="width:100px"><option>Calibri</option><option>Arial</option><option>Roboto</option></select>
      <select class="ribbon-select" style="width:50px"><option>11</option><option>12</option><option>14</option><option>18</option></select>
    </div>
    <div class="ribbon-group">
      <button class="ribbon-btn" id="btnB" title="Bold"><b>B</b></button>
      <button class="ribbon-btn" id="btnI" title="Italic"><i>I</i></button>
      <button class="ribbon-btn" id="btnU" title="Underline"><u>U</u></button>
    </div>
    <div class="ribbon-group">
      <button class="ribbon-btn" id="btnAL" title="Align Left"><svg viewBox="0 0 24 24"><path d="M3 5h18v2H3V5zm0 4h12v2H3V9zm0 4h18v2H3v-2zm0 4h12v2H3v-2z"/></svg></button>
      <button class="ribbon-btn" id="btnAC" title="Align Center"><svg viewBox="0 0 24 24"><path d="M3 5h18v2H3V5zm3 4h12v2H6V9zm-3 4h18v2H3v-2zm3 4h12v2H6v-2z"/></svg></button>
      <button class="ribbon-btn" id="btnAR" title="Align Right"><svg viewBox="0 0 24 24"><path d="M3 5h18v2H3V5zm6 4h12v2H9V9zm-6 4h18v2H3v-2zm6 4h12v2H9v-2z"/></svg></button>
    </div>
    <div class="ribbon-group">
      <button class="ribbon-btn" id="btnBorders" title="Toggle Borders" class="active"><svg viewBox="0 0 24 24"><path d="M3 3h18v18H3V3zm2 2v14h14V5H5zm2 2h2v2H7V7zm4 0h2v2h-2V7zm4 0h2v2h-2V7zM7 11h2v2H7v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2zM7 15h2v2H7v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2z"/></svg></button>
    </div>
  </div>

  <!-- Formula Bar -->
  <div class="formulabar">
    <span class="ref" id="cellRef">A1</span>
    <span class="fx">fx</span>
    <input type="text" id="formulaInput" spellcheck="false" placeholder="Value or =FORMULA">
  </div>

  <!-- Sheet -->
  <div class="gridwrap" id="gridWrap">
    <table class="sheet" id="grid"></table>
  </div>

  <div class="status">
    <span class="stats" id="stats">Ready</span>
    <span style="color:var(--dim2)">Double-click to edit · Drag to select range</span>
  </div>
</div>

<input type="file" id="fileInput" accept=".csv,.xlsx,.xls,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" style="display:none">

<script>
(function(){
'use strict';

const ROWS = 60, COLS = 26;
const STORAGE_KEY = 'tt-xl-sheet';
const THEME_KEY = 'tt-xl-theme';
const HISTORY_MAX = 100;

/* ------------------------------------------------------------
   STATE
   ------------------------------------------------------------ */
let cells = {};
let selected = 'A1';
let selection = { anchor:{ r:0,c:0 }, focus:{ r:0,c:0 } };
let editing = false;
let mouseDown = false;
let dragAnchor = null;
let fillState = null;
let fillHandle = null;
let formulaEditingRef = null;
let cache = new Map();
let autoSaveTimer = null;
let showBorders = true;
let undoStack = [];
let redoStack = [];

/* ------------------------------------------------------------
   HELPERS
   ------------------------------------------------------------ */
const $ = id => document.getElementById(id);
const colName = i => { let s=''; i++; while(i>0){ i--; s=String.fromCharCode(65+i%26)+s; i=Math.floor(i/26); } return s; };
const colIndex = name => { let i=0; for(const ch of name) i=i*26+(ch.charCodeAt(0)-64); return i-1; };
const refToRC = ref => { const m=/^([A-Z]+)(\d+)$/.exec(ref); return m?{c:colIndex(m[1]),r:+m[2]-1}:null; };
const rcToRef = (r,c) => colName(c)+(r+1);
const setStatus = msg => { $('stats').textContent = msg; };

function getRange(){
  return {
    r1: Math.min(selection.anchor.r, selection.focus.r),
    c1: Math.min(selection.anchor.c, selection.focus.c),
    r2: Math.max(selection.anchor.r, selection.focus.r),
    c2: Math.max(selection.anchor.c, selection.focus.c)
  };
}
const rangeSize = rng => (rng.r2-rng.r1+1)*(rng.c2-rng.c1+1);
const rangeLabel = rng => {
  const a = rcToRef(rng.r1,rng.c1), b = rcToRef(rng.r2,rng.c2);
  return a === b ? a : a + ':' + b;
};

/* ------------------------------------------------------------
   FORMULA ENGINE
   ------------------------------------------------------------ */
function evaluate(ref, visiting){
  if(visiting === undefined) visiting = new Set();
  if(cache.has(ref)) return cache.get(ref);
  if(visiting.has(ref)) throw new Error('#CYCLE');
  visiting.add(ref);
  let result;
  try {
    const cell = cells[ref];
    const raw = cell ? String(cell.raw == null ? '' : cell.raw).trim() : '';
    if(!raw) result = '';
    else if(raw[0] === '=') result = evalFormula(raw.slice(1), visiting);
    else result = coerce(raw);
  } catch(e){
    result = e.message === '#CYCLE' ? '#CYCLE' : '#ERR';
  }
  visiting.delete(ref);
  cache.set(ref, result);
  return result;
}
function coerce(raw){
  if(/^-?\d+(\.\d+)?([eE][+-]?\d+)?$/.test(raw)) return parseFloat(raw);
  if(raw === 'TRUE') return true;
  if(raw === 'FALSE') return false;
  return raw;
}
function evalFormula(src, visiting){
  const strs = [];
  let expr = src.replace(/"([^"]*)"/g, (_, s)=>{ strs.push(s); return '\x01'+(strs.length-1)+'\x01'; });
  expr = expr.replace(/([A-Z]+\d+):([A-Z]+\d+)/g, (_, a, b)=>{
    const ra=refToRC(a), rb=refToRC(b);
    if(!ra||!rb) throw new Error('#ERR');
    const r1=Math.min(ra.r,rb.r), r2=Math.max(ra.r,rb.r);
    const c1=Math.min(ra.c,rb.c), c2=Math.max(ra.c,rb.c);
    const vals = [];
    for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++){
      const v = evaluate(rcToRef(r,c), visiting);
      if(v==='#CYCLE'||v==='#ERR') throw new Error(v);
      if(typeof v==='number') vals.push(v);
      else if(typeof v==='string') vals.push(JSON.stringify(v));
      else if(typeof v==='boolean') vals.push(v?'true':'false');
      else vals.push('""');
    }
    return '['+vals.join(',')+']';
  });
  expr = expr.replace(/(?<![A-Z_])([A-Z]+\d+)(?![A-Z_\d\(])/g, (_, ref)=>{
    const v = evaluate(ref, visiting);
    if(v==='#CYCLE'||v==='#ERR') throw new Error(v);
    if(typeof v==='number') return '('+v+')';
    if(typeof v==='boolean') return v?'true':'false';
    if(typeof v==='string') return JSON.stringify(v);
    return '0';
  });
  expr = expr.replace(/\x01(\d+)\x01/g, (_, i)=>JSON.stringify(strs[+i]));
  if(/[^\d\s+\-*/().,%\[\]"'<>=!&|\w]/.test(expr)) throw new Error('#ERR');

  const fns = {
    SUM:function(){ const a=[].concat.apply([],arguments); let s=0; for(const v of a) if(typeof v==='number') s+=v; return s; },
    AVG:function(){ const a=[].concat.apply([],arguments).filter(x=>typeof x==='number'); return a.length?a.reduce((p,c)=>p+c,0)/a.length:0; },
    MIN:function(){ const a=[].concat.apply([],arguments).filter(x=>typeof x==='number'); return a.length?Math.min.apply(Math,a):0; },
    MAX:function(){ const a=[].concat.apply([],arguments).filter(x=>typeof x==='number'); return a.length?Math.max.apply(Math,a):0; },
    COUNT:function(){ return [].concat.apply([],arguments).filter(x=>typeof x==='number').length; },
    ABS:Math.abs, ROUND:(x,d)=>{const p=Math.pow(10,d||0);return Math.round(x*p)/p;},
    FLOOR:Math.floor, CEIL:Math.ceil, SQRT:Math.sqrt, POW:Math.pow,
    IF:(c,a,b)=>c?a:b,
    AND:function(){ return [].concat.apply([],arguments).every(Boolean); },
    OR:function(){ return [].concat.apply([],arguments).some(Boolean); },
    NOT:x=>!x,
    CONCAT:function(){ return [].concat.apply([],arguments).join(''); }
  };
  fns.AVERAGE = fns.AVG;
  const names = Object.keys(fns);
  const fn = Function.apply(null, names.concat(['"use strict";return ('+expr+');']));
  const result = fn.apply(null, names.map(k=>fns[k]));
  if(typeof result==='number' && !isFinite(result)) return '#ERR';
  return result;
}
function adjustFormula(formula, dr, dc){
  if(!formula || formula[0] !== '=') return formula;
  const strs = [];
  let src = formula.slice(1).replace(/"([^"]*)"/g, (_,s)=>{ strs.push(s); return '\x01'+(strs.length-1)+'\x01'; });
  src = src.replace(/([A-Z]+)(\d+)/g, (_, cols, rows)=>{
    const c = colIndex(cols) + dc;
    const r = parseInt(rows, 10) - 1 + dr;
    if(c < 0 || r < 0) return '#REF!';
    return colName(c) + (r + 1);
  });
  src = src.replace(/\x01(\d+)\x01/g, (_, i)=>'"'+strs[+i]+'"');
  return '=' + src;
}
function fmtValue(v){
  if(v === '' || v == null) return '';
  if(typeof v === 'number'){
    if(Number.isInteger(v) && Math.abs(v) < 1e15) return String(v);
    if(Math.abs(v) >= 1e10 || (Math.abs(v) < 1e-4 && v !== 0)) return v.toExponential(4);
    return String(parseFloat(v.toFixed(10)));
  }
  if(typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
  return String(v);
}
function fmtNum(n){
  if(Number.isInteger(n) && Math.abs(n) < 1e12) return String(n);
  return n.toFixed(4).replace(/\.?0+$/, '');
}

/* ------------------------------------------------------------
   CELL WRITES + AUTO-SAVE
   ------------------------------------------------------------ */
function setCell(ref, patch){
  if(!cells[ref]) cells[ref] = {};
  if('raw' in patch) cells[ref].raw = patch.raw;
  if('style' in patch) cells[ref].style = Object.assign({}, cells[ref].style, patch.style);
  const c = cells[ref];
  if((c.raw == null || c.raw === '') && (!c.style || !Object.keys(c.style).length)) delete cells[ref];
}
function invalidate(){ cache = new Map(); }
function autoSave(){
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(()=>{
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cells)); }
    catch(e){ setStatus('⚠ Could not save'); }
  }, 300);
}

/* ------------------------------------------------------------
   UNDO / REDO
   ------------------------------------------------------------ */
function snapshot(){ return JSON.parse(JSON.stringify(cells)); }
function pushUndo(){
  undoStack.push(snapshot());
  if(undoStack.length > HISTORY_MAX) undoStack.shift();
  redoStack = [];
  updateUndoButtons();
}
function undo(){
  if(!undoStack.length) return;
  redoStack.push(snapshot());
  cells = undoStack.pop();
  invalidate(); refreshAll(); updateFormulaBar(); updateUndoButtons(); autoSave();
  setStatus('Undo');
}
function redo(){
  if(!redoStack.length) return;
  undoStack.push(snapshot());
  cells = redoStack.pop();
  invalidate(); refreshAll(); updateFormulaBar(); updateUndoButtons(); autoSave();
  setStatus('Redo');
}
function updateUndoButtons(){
  $('tbUndo').disabled = undoStack.length === 0;
  $('tbRedo').disabled = redoStack.length === 0;
}

/* ------------------------------------------------------------
   EDITING (Input toggling)
   ------------------------------------------------------------ */
function startEdit(initial){
  const inp = grid.querySelector('input[data-ref="' + selected + '"]');
  if(!inp) return;
  inp.readOnly = false;
  inp.classList.add('editing');
  editing = true;
  if(initial !== undefined){
    inp.value = initial;
    inp.setSelectionRange(initial.length, initial.length);
  } else {
    inp.value = (cells[selected] && cells[selected].raw != null) ? cells[selected].raw : '';
    inp.focus();
    inp.select();
  }
  updateFillHandle();
}

function stopEdit(commit){
  if(!editing) return;
  const inp = grid.querySelector('input[data-ref="' + selected + '"]');
  editing = false;
  if(!inp) return;
  inp.classList.remove('editing');
  inp.readOnly = true;
  if(commit){
    const raw = inp.value;
    const prev = (cells[selected] && cells[selected].raw != null) ? cells[selected].raw : '';
    if(raw !== prev){
      pushUndo();
      setCell(selected, { raw: raw });
      invalidate();
      autoSave();
    }
  }
  refreshCell(selected);
  updateFormulaBar();
  updateFillHandle();
  updateStats();
}

function refreshCell(ref){
  const inp = grid.querySelector('input[data-ref="' + ref + '"]');
  if(!inp) return;
  const v = evaluate(ref);
  inp.value = fmtValue(v);
  applyStyle(inp, cells[ref] && cells[ref].style);
  inp.classList.toggle('num', typeof v === 'number');
  inp.classList.toggle('err', v === '#ERR' || v === '#CYCLE');
}

/* ------------------------------------------------------------
   SELECTION
   ------------------------------------------------------------ */
function setSelection(anchorRC, focusRC){
  selection.anchor = anchorRC;
  selection.focus = focusRC || anchorRC;
  selected = rcToRef(anchorRC.r, anchorRC.c);
  updateSelectionUI();
  updateFormulaBar();
  updateToolbarState();
  updateFillHandle();
  updateStats();
}

function moveSelection(dr, dc){
  const cur = selection.anchor;
  const nr = Math.max(0, Math.min(ROWS - 1, cur.r + dr));
  const nc = Math.max(0, Math.min(COLS - 1, cur.c + dc));
  setSelection({ r: nr, c: nc });
}

function updateSelectionUI(){
  grid.querySelectorAll('td.sel,td.active').forEach(td => td.classList.remove('sel','active'));
  const rng = getRange();
  for(let r = rng.r1; r <= rng.r2; r++)
    for(let c = rng.c1; c <= rng.c2; c++){
      const inp = grid.querySelector('input[data-ref="' + rcToRef(r, c) + '"]');
      if(inp) inp.closest('td').classList.add('sel');
    }
  const activeInp = grid.querySelector('input[data-ref="' + selected + '"]');
  if(activeInp) activeInp.closest('td').classList.add('active');
}

function updateStats(){
  const rng = getRange();
  if(rangeSize(rng) === 1){
    const v = evaluate(selected);
    setStatus(typeof v === 'number' ? 'Value: ' + fmtNum(v) : (v === '' ? 'Empty cell' : 'Text'));
    return;
  }
  let sum = 0, numCount = 0, total = 0;
  for(let r = rng.r1; r <= rng.r2; r++)
    for(let c = rng.c1; c <= rng.c2; c++){
      const v = evaluate(rcToRef(r, c));
      total++;
      if(typeof v === 'number'){ sum += v; numCount++; }
    }
  setStatus(numCount > 0
    ? 'Sum: ' + fmtNum(sum) + ' · Avg: ' + fmtNum(sum/numCount) + ' · Count: ' + numCount + ' of ' + total
    : total + ' cells selected');
}

/* ------------------------------------------------------------
   FILL HANDLE
   ------------------------------------------------------------ */
function updateFillHandle(){
  if(fillHandle){ fillHandle.remove(); fillHandle = null; }
  if(editing) return;
  const rng = getRange();
  const cornerRef = rcToRef(rng.r2, rng.c2);
  const inp = grid.querySelector('input[data-ref="' + cornerRef + '"]');
  if(!inp) return;
  fillHandle = document.createElement('div');
  fillHandle.className = 'fill-handle';
  fillHandle.title = 'Drag to fill';
  fillHandle.addEventListener('mousedown', startFill);
  inp.closest('td').appendChild(fillHandle);
}

function startFill(e){
  e.preventDefault();
  e.stopPropagation();
  fillState = { srcRange: getRange(), tgtRange: null };
  mouseDown = 'fill';
}

function previewFill(tgt){
  grid.querySelectorAll('td.fill-preview').forEach(td => td.classList.remove('fill-preview'));
  for(let r = tgt.r1; r <= tgt.r2; r++)
    for(let c = tgt.c1; c <= tgt.c2; c++){
      const inp = grid.querySelector('input[data-ref="' + rcToRef(r, c) + '"]');
      if(inp) inp.closest('td').classList.add('fill-preview');
    }
}

function applyFill(src, tgt){
  pushUndo();
  const srcH = src.r2 - src.r1 + 1;
  const srcW = src.c2 - src.c1 + 1;
  for(let r = tgt.r1; r <= tgt.r2; r++)
    for(let c = tgt.c1; c <= tgt.c2; c++){
      if(r >= src.r1 && r <= src.r2 && c >= src.c1 && c <= src.c2) continue;
      const srcR = src.r1 + (((r - src.r1) % srcH) + srcH) % srcH;
      const srcC = src.c1 + (((c - src.c1) % srcW) + srcW) % srcW;
      const srcCell = cells[rcToRef(srcR, srcC)];
      const tgtRef = rcToRef(r, c);
      if(!srcCell){ delete cells[tgtRef]; continue; }
      let newRaw = srcCell.raw != null ? srcCell.raw : '';
      const dr = r - srcR, dc = c - srcC;
      if(String(newRaw).charAt(0) === '=') newRaw = adjustFormula(newRaw, dr, dc);
      cells[tgtRef] = Object.assign({}, srcCell, { raw: newRaw });
    }
}

/* ------------------------------------------------------------
   GRID BUILD
   ------------------------------------------------------------ */
const grid = $('grid');
const formulaInput = $('formulaInput');
const cellRefEl = $('cellRef');

function buildGrid(){
  grid.innerHTML = '';
  const thead = document.createElement('thead');
  const hr = document.createElement('tr');
  const corner = document.createElement('th'); corner.className = 'corner';
  hr.appendChild(corner);
  for(let c = 0; c < COLS; c++){
    const th = document.createElement('th'); th.textContent = colName(c); hr.appendChild(th);
  }
  thead.appendChild(hr); grid.appendChild(thead);

  const tbody = document.createElement('tbody');
  for(let r = 0; r < ROWS; r++){
    const tr = document.createElement('tr');
    const th = document.createElement('th'); th.textContent = r + 1; tr.appendChild(th);
    for(let c = 0; c < COLS; c++){
      const td = document.createElement('td');
      const inp = document.createElement('input');
      inp.type = 'text'; inp.spellcheck = false; inp.autocomplete = 'off';
      inp.readOnly = true;
      inp.dataset.ref = rcToRef(r, c);
      inp.addEventListener('focus', onCellFocus);
      inp.addEventListener('blur', onCellBlur);
      inp.addEventListener('keydown', onCellKey);
      td.appendChild(inp);
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  grid.appendChild(tbody);

  refreshAll();
  setSelection({ r: 0, c: 0 });
}

/* ------------------------------------------------------------
   CELL EVENTS
   ------------------------------------------------------------ */
function onCellFocus(e){
  const ref = e.target.dataset.ref;
  if(editing && ref !== selected) stopEdit(true);
  if(!editing) setSelection(refToRC(ref));
}

function onCellBlur(e){
  if(editing && e.target.dataset.ref === selected){
    setTimeout(()=>{ if(editing) stopEdit(true); }, 0);
  }
}

function onCellKey(e){
  if(!editing){
    if(e.key === 'Enter' || e.key === 'F2'){
      e.preventDefault(); startEdit(); return;
    }
    if(e.key === 'Tab'){
      e.preventDefault(); moveSelection(0, e.shiftKey ? -1 : 1); return;
    }
    if(e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey){
      e.preventDefault(); startEdit(e.key); return;
    }
    if(e.key === 'Delete' || e.key === 'Backspace'){
      e.preventDefault();
      const rng = getRange();
      pushUndo();
      for(let r = rng.r1; r <= rng.r2; r++)
        for(let c = rng.c1; c <= rng.c2; c++) delete cells[rcToRef(r, c)];
      invalidate(); refreshAll(); autoSave(); updateStats();
      return;
    }
    let dr = 0, dc = 0;
    if(e.key === 'ArrowDown') dr = 1;
    else if(e.key === 'ArrowUp') dr = -1;
    else if(e.key === 'ArrowRight') dc = 1;
    else if(e.key === 'ArrowLeft') dc = -1;
    if(dr || dc){ e.preventDefault(); moveSelection(dr, dc); }
    return;
  }
  if(e.key === 'Enter'){ e.preventDefault(); stopEdit(true); moveSelection(1, 0); }
  else if(e.key === 'Tab'){ e.preventDefault(); stopEdit(true); moveSelection(0, e.shiftKey ? -1 : 1); }
  else if(e.key === 'Escape'){ e.preventDefault(); stopEdit(false); }
}

/* ------------------------------------------------------------
   DRAG-SELECT + DOUBLE-CLICK EDIT
   ------------------------------------------------------------ */
grid.addEventListener('mousedown', e => {
  if(e.target.closest('.fill-handle')) return;
  if(e.button !== 0) return;
  const td = e.target.closest('td');
  if(!td) return;
  const inp = td.querySelector('input');
  if(!inp) return;
  const rc = refToRC(inp.dataset.ref);

  if(editing && inp.dataset.ref !== selected) stopEdit(true);

  mouseDown = true;
  dragAnchor = rc;
  setSelection(rc, rc);
});

grid.addEventListener('dblclick', e => {
  const td = e.target.closest('td');
  if(!td) return;
  const inp = td.querySelector('input');
  if(!inp) return;
  if(editing) return;
  setSelection(refToRC(inp.dataset.ref));
  startEdit();
});

grid.addEventListener('mouseover', e => {
  if(!mouseDown) return;
  const td = e.target.closest('td');
  if(!td) return;
  const inp = td.querySelector('input');
  if(!inp) return;
  const cur = refToRC(inp.dataset.ref);

  if(mouseDown === 'fill' && fillState){
    const src = fillState.srcRange;
    let tgt = { r1: src.r1, c1: src.c1, r2: src.r2, c2: src.c2 };
    const dRow = Math.max(0, cur.r - src.r2) + Math.max(0, src.r1 - cur.r);
    const dCol = Math.max(0, cur.c - src.c2) + Math.max(0, src.c1 - cur.c);
    if(dRow === 0 && dCol === 0){ fillState.tgtRange = null; previewFill(tgt); return; }
    if(dRow >= dCol){
      if(cur.r > src.r2) tgt.r2 = cur.r;
      else if(cur.r < src.r1) tgt.r1 = cur.r;
    } else {
      if(cur.c > src.c2) tgt.c2 = cur.c;
      else if(cur.c < src.c1) tgt.c1 = cur.c;
    }
    fillState.tgtRange = tgt;
    previewFill(tgt);
    return;
  }

  if(dragAnchor) setSelection(dragAnchor, cur);
});

document.addEventListener('mouseup', () => {
  if(mouseDown === 'fill' && fillState){
    const src = fillState.srcRange, tgt = fillState.tgtRange;
    if(tgt && (tgt.r1 < src.r1 || tgt.r2 > src.r2 || tgt.c1 < src.c1 || tgt.c2 > src.c2)){
      applyFill(src, tgt);
      invalidate(); refreshAll(); autoSave();
      setSelection({ r: tgt.r1, c: tgt.c1 }, { r: tgt.r2, c: tgt.c2 });
    }
    grid.querySelectorAll('td.fill-preview').forEach(td => td.classList.remove('fill-preview'));
  }
  mouseDown = false;
  dragAnchor = null;
  fillState = null;
});

/* ------------------------------------------------------------
   STYLE
   ------------------------------------------------------------ */
function applyStyle(inp, style){
  inp.classList.remove('bold','italic','underline','align-left','align-center','align-right');
  if(!style) return;
  if(style.bold) inp.classList.add('bold');
  if(style.italic) inp.classList.add('italic');
  if(style.underline) inp.classList.add('underline');
  if(style.align) inp.classList.add('align-' + style.align);
}
function forEachSelected(fn){
  const rng = getRange();
  for(let r = rng.r1; r <= rng.r2; r++)
    for(let c = rng.c1; c <= rng.c2; c++)
      fn(rcToRef(r, c));
}
function toggleStyle(prop){
  const cur = (cells[selected] && cells[selected].style) || {};
  const val = !cur[prop];
  pushUndo();
  forEachSelected(ref => setCell(ref, { style: { [prop]: val } }));
  invalidate(); refreshAll(); updateToolbarState(); autoSave();
}
function setAlign(align){
  pushUndo();
  forEachSelected(ref => setCell(ref, { style: { align } }));
  invalidate(); refreshAll(); updateToolbarState(); autoSave();
}
function updateToolbarState(){
  const st = (cells[selected] && cells[selected].style) || {};
  $('btnB').classList.toggle('active', !!st.bold);
  $('btnI').classList.toggle('active', !!st.italic);
  $('btnU').classList.toggle('active', !!st.underline);
  $('btnAL').classList.toggle('active', st.align === 'left');
  $('btnAC').classList.toggle('active', st.align === 'center');
  $('btnAR').classList.toggle('active', st.align === 'right');
}

/* ------------------------------------------------------------
   REFRESH
   ------------------------------------------------------------ */
function refreshAll(){
  invalidate();
  grid.querySelectorAll('input[data-ref]').forEach(inp => {
    if(editing && inp.dataset.ref === selected) return;
    const ref = inp.dataset.ref;
    const v = evaluate(ref);
    inp.value = fmtValue(v);
    applyStyle(inp, cells[ref] && cells[ref].style);
    inp.classList.toggle('num', typeof v === 'number');
    inp.classList.toggle('err', v === '#ERR' || v === '#CYCLE');
  });
}

/* ------------------------------------------------------------
   FORMULA BAR
   ------------------------------------------------------------ */
function updateFormulaBar(){
  const rng = getRange();
  cellRefEl.textContent = rangeSize(rng) === 1 ? selected : rangeLabel(rng);
  formulaInput.value = (cells[selected] && cells[selected].raw != null) ? cells[selected].raw : '';
}
function commitFormulaBar(){
  if(!formulaEditingRef) return;
  const ref = formulaEditingRef;
  const v = formulaInput.value;
  const prev = (cells[ref] && cells[ref].raw != null) ? cells[ref].raw : '';
  formulaEditingRef = null;
  if(v !== prev){
    pushUndo();
    setCell(ref, { raw: v });
    invalidate(); refreshAll(); autoSave(); updateStats();
  }
}
formulaInput.addEventListener('focus', () => {
  if(editing) stopEdit(true);
  formulaEditingRef = selected;
  formulaInput.select();
});
formulaInput.addEventListener('blur', commitFormulaBar);
formulaInput.addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); commitFormulaBar(); moveSelection(1, 0); }
  else if(e.key === 'Escape'){ e.preventDefault(); formulaEditingRef = null; updateFormulaBar(); formulaInput.blur(); }
});

/* ------------------------------------------------------------
   IMPORT / EXPORT
   ------------------------------------------------------------ */
$('fileInput').addEventListener('change', e => {
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, { type:'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      if(!ws || !ws['!ref']){ setStatus('Sheet is empty'); return; }
      pushUndo();
      cells = {};
      const range = XLSX.utils.decode_range(ws['!ref']);
      for(let r = range.s.r; r <= range.e.r && r < ROWS; r++)
        for(let c = range.s.c; c <= range.e.c && c < COLS; c++){
          const cell = ws[XLSX.utils.encode_cell({ r, c })];
          if(!cell) continue;
          const ref = rcToRef(r, c);
          if(cell.f) cells[ref] = { raw: '=' + cell.f };
          else if(cell.v !== undefined && cell.v !== '') cells[ref] = { raw: String(cell.v) };
        }
      invalidate(); refreshAll(); updateFormulaBar(); autoSave();
      setStatus('Imported ' + file.name);
    } catch(err){ setStatus('Import failed: ' + err.message); }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
});

function getUsedRange(){
  let r1 = ROWS, c1 = COLS, r2 = -1, c2 = -1;
  for(const ref in cells){
    const cell = cells[ref];
    if(!cell || cell.raw === '' || cell.raw == null) continue;
    const rc = refToRC(ref);
    if(!rc) continue;
    r1 = Math.min(r1, rc.r); c1 = Math.min(c1, rc.c);
    r2 = Math.max(r2, rc.r); c2 = Math.max(c2, rc.c);
  }
  if(r2 === -1) return { r1:0, c1:0, r2:0, c2:0 };
  return { r1, c1, r2, c2 };
}

function exportXlsx(){
  try {
    const wb = XLSX.utils.book_new();
    const ws = {};
    let maxR = 0, maxC = 0;
    for(let r = 0; r < ROWS; r++)
      for(let c = 0; c < COLS; c++){
        const ref = rcToRef(r, c);
        const cell = cells[ref];
        if(!cell || cell.raw == null || cell.raw === '') continue;
        const addr = XLSX.utils.encode_cell({ r, c });
        if(String(cell.raw).charAt(0) === '='){
          const v = evaluate(ref);
          ws[addr] = { f: String(cell.raw).slice(1) };
          if(typeof v === 'number') ws[addr].v = v;
          else if(typeof v === 'string') ws[addr].v = v;
        } else {
          const v = evaluate(ref);
          if(typeof v === 'number') ws[addr] = { t:'n', v };
          else if(typeof v === 'boolean') ws[addr] = { t:'b', v };
          else ws[addr] = { t:'s', v: String(v) };
        }
        if(r > maxR) maxR = r;
        if(c > maxC) maxC = c;
      }
    ws['!ref'] = XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:maxR,c:maxC} });
    XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
    XLSX.writeFile(wb, 'taratari-' + Date.now() + '.xlsx');
    setStatus('Exported XLSX ✓');
  } catch(e){ setStatus('XLSX failed: ' + e.message); }
}

function exportCsv(){
  let out = '';
  for(let r = 0; r < ROWS; r++){
    const row = [];
    for(let c = 0; c < COLS; c++) row.push(csvEscape(evaluate(rcToRef(r, c))));
    out += row.join(',') + '\r\n';
  }
  download(out, 'taratari-' + Date.now() + '.csv', 'text/csv');
  setStatus('Exported CSV ✓');
}

function exportPdf(){
  const { jsPDF } = window.jspdf || {};
  if(!jsPDF){ fallbackPrint(); return; }
  try {
    const rng = getUsedRange();
    const head = [['', ...Array.from({length: rng.c2 - rng.c1 + 1}, (_, i) => colName(rng.c1 + i))]];
    const body = [];
    for(let r = rng.r1; r <= rng.r2; r++){
      const row = [String(r + 1)];
      for(let c = rng.c1; c <= rng.c2; c++) row.push(fmtValue(evaluate(rcToRef(r, c))));
      body.push(row);
    }
    const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
    doc.autoTable({
      head, body, theme: 'grid',
      styles: { fontSize: 9, cellPadding: 3, textColor: [30,30,30] },
      headStyles: { fillColor: [30,30,30], textColor: 255, fontStyle: 'bold' },
      alternateRowStyles: { fillColor: [248,248,248] },
      margin: { top: 30, left: 30, right: 30, bottom: 30 }
    });
    doc.save('taratari-' + Date.now() + '.pdf');
    setStatus('Exported PDF ✓');
  } catch(e){ console.error(e); fallbackPrint(); }
}

function fallbackPrint(){
  const rng = getUsedRange();
  const w = window.open('', '_blank');
  if(!w){ setStatus('Popup blocked — allow popups to print'); return; }
  let html = '<!DOCTYPE html><html><head><title>TaraTari XL</title><style>body{font-family:system-ui;font-size:11px;padding:20px}h1{font-size:16px;margin-bottom:12px}table{border-collapse:collapse}td,th{border:1px solid #aaa;padding:4px 8px;min-width:40px}th{background:#f5f5f5;font-weight:600}</style></head><body><h1>TaraTari XL</h1><table><thead><tr><th></th>';
  for(let c = rng.c1; c <= rng.c2; c++) html += '<th>' + colName(c) + '</th>';
  html += '</tr></thead><tbody>';
  for(let r = rng.r1; r <= rng.r2; r++){
    html += '<tr><th>' + (r+1) + '</th>';
    for(let c = rng.c1; c <= rng.c2; c++) html += '<td>' + escapeHtml(fmtValue(evaluate(rcToRef(r, c)))) + '</td>';
    html += '</tr>';
  }
  html += '</tbody></table><script>window.onload=function(){setTimeout(function(){window.print();},200);}<\/script></body></html>';
  w.document.write(html);
  w.document.close();
}

function csvEscape(v){
  const s = String(v == null ? '' : v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function download(text, name, type){
  const blob = new Blob([text], { type: type || 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ------------------------------------------------------------
   THEME
   ------------------------------------------------------------ */
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem(THEME_KEY, t); } catch(e){}
  updateThemeIcon();
}
function updateThemeIcon(){
  const t = document.documentElement.getAttribute('data-theme');
  const icon = $('themeIcon');
  if(t === 'dark'){
    icon.innerHTML = '<path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>';
  } else {
    icon.innerHTML = '<path d="M12 18a6 6 0 1 1 0-12 6 6 0 0 1 0 12zm0-2a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM11 1h2v3h-2V1zm0 19h2v3h-2v-3zM3.5 4.9l1.4-1.4 2.1 2.1-1.4 1.4-2.1-2.1zm13.5 13.5l1.4-1.4 2.1 2.1-1.4 1.4-2.1-2.1zM1 11h3v2H1v-2zm19 0h3v2h-3v-2zM4.9 19.1l-1.4-1.4 2.1-2.1 1.4 1.4-2.1 2.1zm13.5-13.5l-1.4-1.4 2.1-2.1 1.4 1.4-2.1 2.1z"/>';
  }
}

/* ------------------------------------------------------------
   KEYBOARD (Global Shortcuts)
   ------------------------------------------------------------ */
document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && !e.altKey){
    if(e.key.toLowerCase() === 'z'){
      if(editing) return;
      e.preventDefault(); e.shiftKey ? redo() : undo();
    }
    if(e.key.toLowerCase() === 'y'){
      if(editing) return;
      e.preventDefault(); redo();
    }
    if(e.key.toLowerCase() === 'c'){
      if(editing) return;
      const rng = getRange();
      const data = [];
      for(let r = rng.r1; r <= rng.r2; r++){
        const row = [];
        for(let c = rng.c1; c <= rng.c2; c++){
          const cell = cells[rcToRef(r, c)];
          row.push(cell && cell.raw != null ? cell.raw : '');
        }
        data.push(row);
      }
      internalClip = { data };
      setStatus('Copied ' + rangeLabel(rng));
    }
    if(e.key.toLowerCase() === 'v'){
      if(editing || !internalClip) return;
      e.preventDefault();
      pushUndo();
      const sr = selection.anchor.r, sc = selection.anchor.c;
      for(let dr = 0; dr < internalClip.data.length; dr++)
        for(let dc = 0; dc < internalClip.data[dr].length; dc++){
          const r = sr + dr, c = sc + dc;
          if(r >= ROWS || c >= COLS) continue;
          setCell(rcToRef(r, c), { raw: internalClip.data[dr][dc] });
        }
      invalidate(); refreshAll(); autoSave();
      setStatus('Pasted');
    }
  }
});

let internalClip = null;
grid.addEventListener('paste', e => {
  if(editing) return;
  const text = e.clipboardData && e.clipboardData.getData('text/plain');
  if(!text) return;
  e.preventDefault();
  const rows = text.split(/\r?\n/).map(l => l.split('\t'));
  pushUndo();
  const sr = selection.anchor.r, sc = selection.anchor.c;
  rows.forEach((row, dr) => row.forEach((val, dc) => {
    const r = sr + dr, c = sc + dc;
    if(r >= ROWS || c >= COLS) return;
    setCell(rcToRef(r, c), { raw: val });
  }));
  invalidate(); refreshAll(); autoSave();
});

/* ------------------------------------------------------------
   INIT
   ------------------------------------------------------------ */
(function init(){
  try {
    const saved = localStorage.getItem(THEME_KEY);
    setTheme(saved || 'light');
  } catch(e){ setTheme('light'); }

  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ const p = JSON.parse(raw); if(p && typeof p === 'object') cells = p; }
  } catch(e){ cells = {}; }

  buildGrid();
  updateUndoButtons();

  setTimeout(() => {
    const inp = grid.querySelector('input[data-ref="A1"]');
    if(inp) inp.focus();
  }, 50);

  setStatus('Ready');
})();

})();
